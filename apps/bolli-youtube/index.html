<!doctype html>
<html>
<head>
<meta charset="utf-8">
<title>Bolli YouTube</title>
<script>
  // Layout is written in 1280x720 units; draw it at the window the TV gives: appinfo names no resolution, so it is
  // the TV's graphics, 1920x1080 on a 4K TV and 1280x720 on an HD or Full HD one (a 1920x1080 app there is cut off)
  document.documentElement.style.zoom = Math.max(1, window.innerWidth / 1280);
</script>
<link rel="stylesheet" href="themes/base.css">
<link rel="stylesheet" href="app.css">
<link rel="stylesheet" id="theme-css" href="themes/youtube.css">
</head>
<body>
<div id="app"></div>
<!-- A youtube.com page that API requests are sent from (src/youtube/api/youtube.ts); it loads alongside the app's script -->
<iframe id="youtube" class="by-hidden" sandbox="allow-scripts allow-same-origin" src="https://www.youtube.com/robots.txt" onload="this.setAttribute('data-loaded', '1')"></iframe>
<!-- webOS TV 1.x-2.x's old engine (WebKit: webOS 3 and later name their Chrome) with its early Promise: promise.js
     stands in for it there, and never anywhere else -->
<script>if (!/Chrome\//.test(navigator.userAgent) && !(window.Promise && Promise.all && Promise.race)) { document.write('<script src="promise.js"><\/script>'); }</script>
<script src="app.js"></script>
</body>
</html>
